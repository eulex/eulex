<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 56" width="100%" role="img" aria-label="stack ticker">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.06" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.94" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="edgeMask">
      <rect width="1200" height="56" fill="url(#fade)"/>
    </mask>
  </defs>

  <rect width="1200" height="56" rx="8" fill="#0a0420"/>

  <g mask="url(#edgeMask)">
    <g>
      <animateTransform attributeName="transform" type="translate"
                        values="0 0; -1400 0" dur="28s" repeatCount="indefinite"/>

      <!-- copy 1 -->
      <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="700" letter-spacing="2">
        <g transform="translate(15,13)"><rect width="86" height="30" rx="6" fill="#0d0d18" stroke="#ffd43b" stroke-opacity="0.45"/><text x="43" y="20" text-anchor="middle" fill="#ffd43b">PYTHON</text></g>
        <g transform="translate(115,13)"><rect width="86" height="30" rx="6" fill="#0d0d18" stroke="#ff5722" stroke-opacity="0.45"/><text x="43" y="20" text-anchor="middle" fill="#ff5722">RUST</text></g>
        <g transform="translate(215,13)"><rect width="86" height="30" rx="6" fill="#0d0d18" stroke="#3178c6" stroke-opacity="0.45"/><text x="43" y="20" text-anchor="middle" fill="#3178c6">TYPESCRIPT</text></g>
        <g transform="translate(315,13)"><rect width="86" height="30" rx="6" fill="#0d0d18" stroke="#a8b9cc" stroke-opacity="0.45"/><text x="43" y="20" text-anchor="middle" fill="#a8b9cc">C</text></g>
