        <g transform="translate(515,13)"><rect width="86" height="30" rx="6" fill="#0d0d18" stroke="#4eaa25" stroke-opacity="0.45"/><text x="43" y="20" text-anchor="middle" fill="#4eaa25">BASH</text></g>
        <g transform="translate(615,13)"><rect width="86" height="30" rx="6" fill="#0d0d18" stroke="#24c8db" stroke-opacity="0.45"/><text x="43" y="20" text-anchor="middle" fill="#24c8db">TAURI</text></g>
        <g transform="translate(715,13)"><rect width="86" height="30" rx="6" fill="#0d0d18" stroke="#61dafb" stroke-opacity="0.45"/><text x="43" y="20" text-anchor="middle" fill="#61dafb">REACT</text></g>
        <g transform="translate(815,13)"><rect width="86" height="30" rx="6" fill="#0d0d18" stroke="#4169e1" stroke-opacity="0.45"/><text x="43" y="20" text-anchor="middle" fill="#4169e1">POSTGRES</text></g>
        <g transform="translate(915,13)"><rect width="86" height="30" rx="6" fill="#0d0d18" stroke="#dc382d" stroke-opacity="0.45"/><text x="43" y="20" text-anchor="middle" fill="#dc382d">REDIS</text></g>
        <g transform="translate(1015,13)"><rect width="86" height="30" rx="6" fill="#0d0d18" stroke="#2496ed" stroke-opacity="0.45"/><text x="43" y="20" text-anchor="middle" fill="#2496ed">DOCKER</text></g>
        <g transform="translate(1115,13)"><rect width="86" height="30" rx="6" fill="#0d0d18" stroke="#fcc624" stroke-opacity="0.45"/><text x="43" y="20" text-anchor="middle" fill="#fcc624">LINUX</text></g>
        <g transform="translate(1215,13)"><rect width="86" height="30" rx="6" fill="#0d0d18" stroke="#57a143" stroke-opacity="0.45"/><text x="43" y="20" text-anchor="middle" fill="#57a143">NEOVIM</text></g>
        <g transform="translate(1315,13)"><rect width="86" height="30" rx="6" fill="#0d0d18" stroke="#f05032" stroke-opacity="0.45"/><text x="43" y="20" text-anchor="middle" fill="#f05032">GIT</text></g>
      </g>

