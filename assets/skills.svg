<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" role="img" aria-label="eule profile core">
  <defs>
    <linearGradient id="bgGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0d0d18"/>
      <stop offset="100%" stop-color="#0a0420"/>
    </linearGradient>

    <linearGradient id="towerTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff8acb"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="towerLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3a1a6a"/>
      <stop offset="100%" stop-color="#6a2eb0"/>
    </linearGradient>
    <linearGradient id="towerRight" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#7a3acf"/>
      <stop offset="100%" stop-color="#9d4edd"/>
    </linearGradient>

    <linearGradient id="topShimmer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="ringGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="1"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ringGrad2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#8a2be2" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0a0420" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a2be2"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0 L0 0 0 22" stroke="#1a1530" stroke-width="0.4" fill="none"/>
    </pattern>
  </defs>

  <rect width="1200" height="600" rx="12" fill="url(#bgGrad)"/>
  <rect width="1200" height="600" rx="12" fill="url(#grid)" opacity="0.4"/>

  <!-- ╭── HEADER ──────────────────────────────────────────────╮ -->
  <g font-family="ui-monospace,Menlo,Consolas,monospace">
    <line x1="24" y1="44" x2="1176" y2="44" stroke="#1a1530"/>
    <text x="32" y="27" fill="#a78bfa" font-size="11" letter-spacing="3">EULE.PROFILE</text>
    <text x="180" y="27" fill="#4a4a60" font-size="11" letter-spacing="2">v0.7.2</text>
    <text x="240" y="27" fill="#2a2050" font-size="11">·</text>
    <text x="260" y="27" fill="#c9d1d9" font-size="11" letter-spacing="2">MAINFRAME</text>
    <text x="370" y="27" fill="#2a2050" font-size="11">·</text>
    <text x="390" y="27" fill="#c9d1d9" font-size="11" letter-spacing="2">LIVE</text>
    <text x="430" y="27" fill="#2a2050" font-size="11">·</text>
    <text x="450" y="27" fill="#c9d1d9" font-size="11" letter-spacing="2">60FPS</text>

    <circle cx="930" cy="23" r="3.5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="942" y="27" fill="#10b981" font-size="11" letter-spacing="3">ONLINE</text>
    <text x="1010" y="27" fill="#2a2050" font-size="11">·</text>
    <text x="1030" y="27" fill="#ec4899" font-size="11" letter-spacing="3">LEVELING UP</text>
  </g>

  <!-- ambient particles -->
  <g opacity="0.55">
    <circle cx="120" cy="100" r="1.2" fill="#c084fc"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="125" r="1" fill="#ec4899"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" repeatCount="indefinite" begin="0.7s"/></circle>
    <circle cx="600" cy="80" r="0.9" fill="#a78bfa"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite" begin="1.4s"/></circle>
    <circle cx="1080" cy="470" r="1" fill="#ec4899"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite" begin="1.1s"/></circle>
    <circle cx="50" cy="280" r="0.9" fill="#a78bfa"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" repeatCount="indefinite" begin="1.8s"/></circle>
    <circle cx="1150" cy="320" r="1.2" fill="#c084fc"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.9s" repeatCount="indefinite" begin="2.2s"/></circle>
    <circle cx="450" cy="120" r="0.8" fill="#ec4899"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.7s" repeatCount="indefinite" begin="0.2s"/></circle>
    <circle cx="320" cy="120" r="0.9" fill="#c084fc"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" repeatCount="indefinite" begin="2.5s"/></circle>
  </g>

  <!-- ╭── LEFT · SKILL CITY ───────────────────────────────────╮ -->
  <g>
    <text x="40" y="78" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#6a6a80" letter-spacing="3">SKILL · CITY · ISOMETRIC</text>
    <line x1="244" y1="74" x2="700" y2="74" stroke="#1a1530"/>
    <text x="700" y="78" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9" fill="#4a4a60" letter-spacing="2">/ 6 VECTORS</text>

    <!-- Y-axis ticks -->
    <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9" fill="#4a4a60" letter-spacing="1">
      <line x1="40" y1="160" x2="40" y2="430" stroke="#1a1530" stroke-width="1"/>
      <line x1="40" y1="160" x2="34" y2="160" stroke="#2a2050"/>
      <text x="30" y="163" text-anchor="end">100</text>
      <line x1="40" y1="220" x2="34" y2="220" stroke="#2a2050"/>
      <text x="30" y="223" text-anchor="end">75</text>
      <line x1="40" y1="280" x2="34" y2="280" stroke="#2a2050"/>
      <text x="30" y="283" text-anchor="end">50</text>
      <line x1="40" y1="340" x2="34" y2="340" stroke="#2a2050"/>
      <text x="30" y="343" text-anchor="end">25</text>
      <line x1="40" y1="430" x2="34" y2="430" stroke="#2a2050"/>
      <text x="30" y="433" text-anchor="end">0</text>
    </g>

    <!-- ground plane -->
    <g opacity="0.7">
      <polygon points="60,430 700,430 660,470 100,470" fill="#0d0d18" stroke="#1a1530" stroke-width="1"/>
      <g stroke="#2a2050" stroke-width="0.5" opacity="0.6">
        <line x1="160" y1="430" x2="142" y2="470"/>
        <line x1="260" y1="430" x2="242" y2="470"/>
        <line x1="360" y1="430" x2="342" y2="470"/>
        <line x1="460" y1="430" x2="442" y2="470"/>
        <line x1="560" y1="430" x2="542" y2="470"/>
        <line x1="660" y1="430" x2="642" y2="470"/>
      </g>
    </g>

    <!-- TOWER 1 · AI·ML · 80 → height 96 -->
    <g transform="translate(125,430)">
      <polygon points="0,0 36,-20 0,-40 -36,-20" fill="#000" opacity="0.45" transform="translate(8,4)"/>
      <polygon points="-36,-20 0,0 0,-96 -36,-116" fill="url(#towerLeft)"/>
      <polygon points="36,-20 0,0 0,-96 36,-116" fill="url(#towerRight)"/>
      <polygon points="0,-96 36,-116 0,-136 -36,-116" fill="url(#towerTop)" stroke="#ffffff" stroke-width="0.8" filter="url(#glow)"/>
      <polygon points="0,-96 36,-116 0,-136 -36,-116" fill="url(#topShimmer)" opacity="0">
        <animate attributeName="opacity" values="0;0.7;0" dur="3.6s" repeatCount="indefinite"/>
      </polygon>
      <text x="0" y="-150" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="800" fill="#ec4899" letter-spacing="1">80</text>
      <text x="0" y="50" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#c9d1d9" letter-spacing="2">AI · ML</text>
    </g>

    <!-- TOWER 2 · SECURITY · 75 → height 90 -->
    <g transform="translate(220,430)">
      <polygon points="0,0 36,-20 0,-40 -36,-20" fill="#000" opacity="0.45" transform="translate(8,4)"/>
      <polygon points="-36,-20 0,0 0,-90 -36,-110" fill="url(#towerLeft)"/>
      <polygon points="36,-20 0,0 0,-90 36,-110" fill="url(#towerRight)"/>
      <polygon points="0,-90 36,-110 0,-130 -36,-110" fill="url(#towerTop)" stroke="#ffffff" stroke-width="0.8" filter="url(#glow)"/>
      <polygon points="0,-90 36,-110 0,-130 -36,-110" fill="url(#topShimmer)" opacity="0">
        <animate attributeName="opacity" values="0;0.7;0" dur="3.6s" begin="0.4s" repeatCount="indefinite"/>
      </polygon>
      <text x="0" y="-144" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="800" fill="#ec4899" letter-spacing="1">75</text>
      <text x="0" y="50" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#c9d1d9" letter-spacing="2">SECURITY</text>
    </g>

    <!-- TOWER 3 · SYSTEMS · 68 → height 82 -->
    <g transform="translate(315,430)">
      <polygon points="0,0 36,-20 0,-40 -36,-20" fill="#000" opacity="0.45" transform="translate(8,4)"/>
      <polygon points="-36,-20 0,0 0,-82 -36,-102" fill="url(#towerLeft)"/>
      <polygon points="36,-20 0,0 0,-82 36,-102" fill="url(#towerRight)"/>
      <polygon points="0,-82 36,-102 0,-122 -36,-102" fill="url(#towerTop)" stroke="#ffffff" stroke-width="0.8" filter="url(#glow)"/>
      <polygon points="0,-82 36,-102 0,-122 -36,-102" fill="url(#topShimmer)" opacity="0">
        <animate attributeName="opacity" values="0;0.7;0" dur="3.6s" begin="0.8s" repeatCount="indefinite"/>
      </polygon>
      <text x="0" y="-136" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="800" fill="#ec4899" letter-spacing="1">68</text>
      <text x="0" y="50" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#c9d1d9" letter-spacing="2">SYSTEMS</text>
    </g>

    <!-- TOWER 4 · INFRA · 60 → height 72 -->
    <g transform="translate(410,430)">
      <polygon points="0,0 36,-20 0,-40 -36,-20" fill="#000" opacity="0.45" transform="translate(8,4)"/>
      <polygon points="-36,-20 0,0 0,-72 -36,-92" fill="url(#towerLeft)"/>
      <polygon points="36,-20 0,0 0,-72 36,-92" fill="url(#towerRight)"/>
      <polygon points="0,-72 36,-92 0,-112 -36,-92" fill="url(#towerTop)" stroke="#ffffff" stroke-width="0.8" filter="url(#glow)"/>
      <polygon points="0,-72 36,-92 0,-112 -36,-92" fill="url(#topShimmer)" opacity="0">
        <animate attributeName="opacity" values="0;0.7;0" dur="3.6s" begin="1.2s" repeatCount="indefinite"/>
      </polygon>
      <text x="0" y="-126" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="800" fill="#ec4899" letter-spacing="1">60</text>
      <text x="0" y="50" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#c9d1d9" letter-spacing="2">INFRA</text>
    </g>

    <!-- TOWER 5 · TOOLING · 70 → height 84 -->
    <g transform="translate(505,430)">
      <polygon points="0,0 36,-20 0,-40 -36,-20" fill="#000" opacity="0.45" transform="translate(8,4)"/>
      <polygon points="-36,-20 0,0 0,-84 -36,-104" fill="url(#towerLeft)"/>
      <polygon points="36,-20 0,0 0,-84 36,-104" fill="url(#towerRight)"/>
      <polygon points="0,-84 36,-104 0,-124 -36,-104" fill="url(#towerTop)" stroke="#ffffff" stroke-width="0.8" filter="url(#glow)"/>
      <polygon points="0,-84 36,-104 0,-124 -36,-104" fill="url(#topShimmer)" opacity="0">
        <animate attributeName="opacity" values="0;0.7;0" dur="3.6s" begin="1.6s" repeatCount="indefinite"/>
      </polygon>
      <text x="0" y="-138" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="800" fill="#ec4899" letter-spacing="1">70</text>
      <text x="0" y="50" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#c9d1d9" letter-spacing="2">TOOLING</text>
    </g>

    <!-- TOWER 6 · FRONTEND · 72 → height 86 -->
    <g transform="translate(600,430)">
      <polygon points="0,0 36,-20 0,-40 -36,-20" fill="#000" opacity="0.45" transform="translate(8,4)"/>
      <polygon points="-36,-20 0,0 0,-86 -36,-106" fill="url(#towerLeft)"/>
      <polygon points="36,-20 0,0 0,-86 36,-106" fill="url(#towerRight)"/>
      <polygon points="0,-86 36,-106 0,-126 -36,-106" fill="url(#towerTop)" stroke="#ffffff" stroke-width="0.8" filter="url(#glow)"/>
      <polygon points="0,-86 36,-106 0,-126 -36,-106" fill="url(#topShimmer)" opacity="0">
        <animate attributeName="opacity" values="0;0.7;0" dur="3.6s" begin="2.0s" repeatCount="indefinite"/>
      </polygon>
      <text x="0" y="-140" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="800" fill="#ec4899" letter-spacing="1">72</text>
      <text x="0" y="50" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#c9d1d9" letter-spacing="2">FRONTEND</text>
    </g>
  </g>

  <!-- ╭── RIGHT · NEURAL CORE ─────────────────────────────────╮ -->
  <g>
    <text x="780" y="78" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#6a6a80" letter-spacing="3">NEURAL · CORE · ELO</text>
    <line x1="950" y1="74" x2="1160" y2="74" stroke="#1a1530"/>
  </g>

  <g transform="translate(960, 280)">
    <!-- soft glow -->
    <circle cx="0" cy="0" r="135" fill="url(#coreGlow)" filter="url(#softGlow)">
      <animate attributeName="r" values="125;145;125" dur="4s" repeatCount="indefinite"/>
    </circle>

    <!-- outer ring rotating CW (14s) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="135" fill="none" stroke="url(#ringGrad1)" stroke-width="1.4" stroke-dasharray="6 4"/>
      <circle cx="0" cy="-135" r="3.5" fill="#ec4899"/>
      <circle cx="135" cy="0" r="2" fill="#a78bfa"/>
    </g>

    <!-- middle ring CCW (9s) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="9s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="115" fill="none" stroke="url(#ringGrad2)" stroke-width="1" stroke-dasharray="2 6"/>
      <circle cx="0" cy="115" r="3" fill="#c084fc"/>
    </g>

    <!-- inner static ring -->
    <circle cx="0" cy="0" r="95" fill="none" stroke="#2a2050" stroke-width="1"/>
    <g stroke="#3a3050" stroke-width="0.8" opacity="0.7">
      <line x1="0" y1="-95" x2="0" y2="-91"/>
      <line x1="0" y1="95" x2="0" y2="91"/>
      <line x1="95" y1="0" x2="91" y2="0"/>
      <line x1="-95" y1="0" x2="-91" y2="0"/>
    </g>

    <!-- ELO mega number — spaced out vertical hierarchy -->
    <g text-anchor="middle">
      <text y="-58" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#a78bfa" letter-spacing="6">ELO</text>
      <line x1="-22" y1="-46" x2="22" y2="-46" stroke="#2a2050" stroke-width="0.6"/>
      <text y="20" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="60" font-weight="800" fill="#ffffff" letter-spacing="-2" filter="url(#glow)">1247</text>
      <line x1="-30" y1="40" x2="30" y2="40" stroke="#2a2050" stroke-width="0.6"/>
      <text y="60" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#ec4899" letter-spacing="4">ARCHITECT</text>
      <text y="80" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9" fill="#6a6a80" letter-spacing="2">TIER · IV / VI</text>
    </g>
  </g>

  <!-- progress panel -->
  <g transform="translate(800, 440)">
    <rect width="320" height="74" rx="8" fill="#0d0d18" stroke="#2a2050" stroke-width="1"/>
    <text x="20" y="22" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9" fill="#6a6a80" letter-spacing="3">NEXT · TIER · TARGET 1500</text>
    <rect x="20" y="34" width="280" height="8" rx="4" fill="#1a1530"/>
    <rect x="20" y="34" width="232" height="8" rx="4" fill="url(#bar)"/>
    <text x="20" y="60" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9" fill="#a78bfa" letter-spacing="2">+253 XP</text>
    <text x="300" y="60" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9" fill="#ec4899" letter-spacing="2">83%</text>
  </g>

  <!-- ╭── KPI STRIP ───────────────────────────────────────────╮ -->
  <g transform="translate(40, 568)" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" letter-spacing="2">
    <line x1="-16" y1="-14" x2="1136" y2="-14" stroke="#1a1530"/>
    <text x="0" y="0" fill="#6a6a80">COMMITS</text>
    <text x="68" y="0" fill="#ffffff" font-weight="700">24</text>

    <text x="118" y="0" fill="#2a2050">│</text>
    <text x="138" y="0" fill="#6a6a80">LANGS</text>
    <text x="190" y="0" fill="#ffffff" font-weight="700">6</text>

    <text x="220" y="0" fill="#2a2050">│</text>
    <text x="240" y="0" fill="#6a6a80">FOCUS</text>
    <text x="290" y="0" fill="#ffffff" font-weight="700">AI · SEC · INFRA</text>

    <text x="450" y="0" fill="#2a2050">│</text>
    <text x="470" y="0" fill="#6a6a80">SINCE</text>
    <text x="520" y="0" fill="#ffffff" font-weight="700">2026.04</text>

    <text x="600" y="0" fill="#2a2050">│</text>
    <text x="620" y="0" fill="#6a6a80">CLASS</text>
    <text x="670" y="0" fill="#ffffff" font-weight="700">SELF-TAUGHT</text>

    <text x="800" y="0" fill="#2a2050">│</text>
    <text x="820" y="0" fill="#6a6a80">TREND</text>
    <text x="870" y="0" fill="#10b981" font-weight="700">↗ ASCENDING</text>

    <text x="1010" y="0" fill="#2a2050">│</text>
    <text x="1030" y="0" fill="#6a6a80">RANK</text>
    <text x="1075" y="0" fill="#ec4899" font-weight="700">B+</text>
  </g>

  <!-- corner brackets -->
  <g stroke="#3a2470" stroke-width="1" fill="none" opacity="0.6">
    <path d="M14 14 L14 32 M14 14 L32 14"/>
    <path d="M1186 14 L1186 32 M1186 14 L1168 14"/>
    <path d="M14 586 L14 568 M14 586 L32 586"/>
    <path d="M1186 586 L1186 568 M1186 586 L1168 586"/>
  </g>
</svg>
