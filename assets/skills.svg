<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" role="img" aria-label="eule profile core">
  <defs>
    <linearGradient id="bgGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0d0d18"/>
      <stop offset="100%" stop-color="#0a0420"/>
    </linearGradient>

    <!-- Tower face gradients -->
    <linearGradient id="towerTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff8acb"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="towerLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5a2a8a"/>
      <stop offset="100%" stop-color="#8a2be2"/>
    </linearGradient>
    <linearGradient id="towerRight" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#9d4edd"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- shimmer for tower faces -->
    <linearGradient id="shimmer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- ELO ring gradient -->
    <linearGradient id="ring1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ring2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#8a2be2"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#8a2be2" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0a0420" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a2be2"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0 L0 0 0 22" stroke="#1a1530" stroke-width="0.4" fill="none"/>
    </pattern>
  </defs>

  <rect width="1200" height="620" rx="12" fill="url(#bgGrad)"/>
  <rect width="1200" height="620" rx="12" fill="url(#grid)" opacity="0.4"/>

  <!-- ─── HEADER ─── -->
  <g font-family="ui-monospace,Menlo,Consolas,monospace">
    <line x1="20" y1="48" x2="1180" y2="48" stroke="#1a1530"/>
    <text x="32" y="30" fill="#a78bfa" font-size="11" letter-spacing="3">EULE.PROFILE</text>
    <text x="138" y="30" fill="#4a4a60" font-size="11" letter-spacing="2">v0.7.2</text>
    <text x="200" y="30" fill="#4a4a60" font-size="11" letter-spacing="2">·</text>
    <text x="216" y="30" fill="#c9d1d9" font-size="11" letter-spacing="2">MAINFRAME</text>
    <text x="338" y="30" fill="#4a4a60" font-size="11" letter-spacing="2">·</text>
    <text x="354" y="30" fill="#c9d1d9" font-size="11" letter-spacing="2">LIVE · 60FPS</text>

    <circle cx="1018" cy="26" r="3.5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="1030" y="30" fill="#10b981" font-size="11" letter-spacing="3">ONLINE</text>
    <text x="1086" y="30" fill="#4a4a60" font-size="11" letter-spacing="2">·</text>
    <text x="1102" y="30" fill="#ec4899" font-size="11" letter-spacing="3">LEVELING UP</text>
  </g>

  <!-- ─── BACKGROUND PARTICLES ─── -->
  <g opacity="0.6">
    <circle cx="120" cy="100" r="1.2" fill="#c084fc"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="140" r="1" fill="#ec4899"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" repeatCount="indefinite" begin="0.7s"/></circle>
    <circle cx="600" cy="80" r="0.9" fill="#a78bfa"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite" begin="1.4s"/></circle>
    <circle cx="200" cy="540" r="1.3" fill="#c084fc"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite" begin="0.4s"/></circle>
    <circle cx="1080" cy="500" r="1" fill="#ec4899"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite" begin="1.1s"/></circle>
    <circle cx="50" cy="280" r="0.9" fill="#a78bfa"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" repeatCount="indefinite" begin="1.8s"/></circle>
    <circle cx="1150" cy="320" r="1.2" fill="#c084fc"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.9s" repeatCount="indefinite" begin="2.2s"/></circle>
    <circle cx="450" cy="120" r="0.8" fill="#ec4899"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.7s" repeatCount="indefinite" begin="0.2s"/></circle>
    <circle cx="850" cy="560" r="1" fill="#a78bfa"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite" begin="1.5s"/></circle>
    <circle cx="320" cy="500" r="0.9" fill="#c084fc"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" repeatCount="indefinite" begin="2.5s"/></circle>
  </g>

  <!-- ─── LEFT: ISOMETRIC SKILL CITY ─── -->
  <g>
    <text x="40" y="90" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#6a6a80" letter-spacing="3">SKILL · CITY · ISOMETRIC</text>
    <line x1="240" y1="86" x2="700" y2="86" stroke="#1a1530"/>

    <!-- Iso ground plane (thin rhombus shadow) -->
    <g opacity="0.5">
      <polygon points="60,500 740,500 690,540 110,540" fill="#0d0d18" stroke="#1a1530" stroke-width="1"/>
      <!-- ground tick lines -->
      <g stroke="#2a2050" stroke-width="0.5" opacity="0.5">
        <line x1="180" y1="500" x2="160" y2="540"/>
        <line x1="280" y1="500" x2="260" y2="540"/>
        <line x1="380" y1="500" x2="360" y2="540"/>
        <line x1="480" y1="500" x2="460" y2="540"/>
        <line x1="580" y1="500" x2="560" y2="540"/>
        <line x1="680" y1="500" x2="660" y2="540"/>
      </g>
    </g>

    <!-- Tower 1: AI · ML — score 80, height 56 -->
    <g transform="translate(140,500)">
      <!-- score number above -->
      <text x="0" y="-72" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#ec4899" letter-spacing="1">80</text>
      <!-- shadow -->
      <polygon points="0,0 35,-20 0,-40 -35,-20" fill="#000" opacity="0.5" transform="translate(8,4)"/>
      <!-- tower group with grow animation -->
      <g>
        <animateTransform attributeName="transform" type="scale" values="1 0; 1 1" dur="1s" begin="0s" fill="freeze"/>
        <g transform="translate(0,0)">
          <!-- LEFT face -->
          <polygon points="-35,-20 0,0 0,-56 -35,-76" fill="url(#towerLeft)" stroke="#a78bfa" stroke-width="0.5"/>
          <!-- RIGHT face -->
          <polygon points="35,-20 0,0 0,-56 35,-76" fill="url(#towerRight)" stroke="#a78bfa" stroke-width="0.5"/>
          <!-- TOP face -->
          <polygon points="0,-56 35,-76 0,-96 -35,-76" fill="url(#towerTop)" stroke="#ffffff" stroke-width="0.6" filter="url(#glow)"/>
        </g>
      </g>
      <!-- label -->
      <text x="0" y="60" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#c9d1d9" letter-spacing="2">AI · ML</text>
    </g>

    <!-- Tower 2: SECURITY — 75, height 52 -->
    <g transform="translate(240,500)">
      <text x="0" y="-68" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#ec4899" letter-spacing="1">75</text>
      <polygon points="0,0 35,-20 0,-40 -35,-20" fill="#000" opacity="0.5" transform="translate(8,4)"/>
      <g>
        <animateTransform attributeName="transform" type="scale" values="1 0; 1 1" dur="1s" begin="0.15s" fill="freeze"/>
        <polygon points="-35,-20 0,0 0,-52 -35,-72" fill="url(#towerLeft)" stroke="#a78bfa" stroke-width="0.5"/>
        <polygon points="35,-20 0,0 0,-52 35,-72" fill="url(#towerRight)" stroke="#a78bfa" stroke-width="0.5"/>
        <polygon points="0,-52 35,-72 0,-92 -35,-72" fill="url(#towerTop)" stroke="#ffffff" stroke-width="0.6" filter="url(#glow)"/>
      </g>
      <text x="0" y="60" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#c9d1d9" letter-spacing="2">SECURITY</text>
    </g>

    <!-- Tower 3: SYSTEMS — 68, height 47 -->
    <g transform="translate(340,500)">
      <text x="0" y="-63" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#ec4899" letter-spacing="1">68</text>
      <polygon points="0,0 35,-20 0,-40 -35,-20" fill="#000" opacity="0.5" transform="translate(8,4)"/>
      <g>
        <animateTransform attributeName="transform" type="scale" values="1 0; 1 1" dur="1s" begin="0.3s" fill="freeze"/>
        <polygon points="-35,-20 0,0 0,-47 -35,-67" fill="url(#towerLeft)" stroke="#a78bfa" stroke-width="0.5"/>
        <polygon points="35,-20 0,0 0,-47 35,-67" fill="url(#towerRight)" stroke="#a78bfa" stroke-width="0.5"/>
        <polygon points="0,-47 35,-67 0,-87 -35,-67" fill="url(#towerTop)" stroke="#ffffff" stroke-width="0.6" filter="url(#glow)"/>
      </g>
      <text x="0" y="60" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#c9d1d9" letter-spacing="2">SYSTEMS</text>
    </g>

    <!-- Tower 4: INFRA — 60, height 42 -->
    <g transform="translate(440,500)">
      <text x="0" y="-58" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#ec4899" letter-spacing="1">60</text>
      <polygon points="0,0 35,-20 0,-40 -35,-20" fill="#000" opacity="0.5" transform="translate(8,4)"/>
      <g>
        <animateTransform attributeName="transform" type="scale" values="1 0; 1 1" dur="1s" begin="0.45s" fill="freeze"/>
        <polygon points="-35,-20 0,0 0,-42 -35,-62" fill="url(#towerLeft)" stroke="#a78bfa" stroke-width="0.5"/>
        <polygon points="35,-20 0,0 0,-42 35,-62" fill="url(#towerRight)" stroke="#a78bfa" stroke-width="0.5"/>
        <polygon points="0,-42 35,-62 0,-82 -35,-62" fill="url(#towerTop)" stroke="#ffffff" stroke-width="0.6" filter="url(#glow)"/>
      </g>
      <text x="0" y="60" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#c9d1d9" letter-spacing="2">INFRA</text>
    </g>

    <!-- Tower 5: TOOLING — 70, height 49 -->
    <g transform="translate(540,500)">
      <text x="0" y="-65" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#ec4899" letter-spacing="1">70</text>
      <polygon points="0,0 35,-20 0,-40 -35,-20" fill="#000" opacity="0.5" transform="translate(8,4)"/>
      <g>
        <animateTransform attributeName="transform" type="scale" values="1 0; 1 1" dur="1s" begin="0.6s" fill="freeze"/>
        <polygon points="-35,-20 0,0 0,-49 -35,-69" fill="url(#towerLeft)" stroke="#a78bfa" stroke-width="0.5"/>
        <polygon points="35,-20 0,0 0,-49 35,-69" fill="url(#towerRight)" stroke="#a78bfa" stroke-width="0.5"/>
        <polygon points="0,-49 35,-69 0,-89 -35,-69" fill="url(#towerTop)" stroke="#ffffff" stroke-width="0.6" filter="url(#glow)"/>
      </g>
      <text x="0" y="60" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#c9d1d9" letter-spacing="2">TOOLING</text>
    </g>

    <!-- Tower 6: FRONTEND — 72, height 50 -->
    <g transform="translate(640,500)">
      <text x="0" y="-66" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#ec4899" letter-spacing="1">72</text>
      <polygon points="0,0 35,-20 0,-40 -35,-20" fill="#000" opacity="0.5" transform="translate(8,4)"/>
      <g>
        <animateTransform attributeName="transform" type="scale" values="1 0; 1 1" dur="1s" begin="0.75s" fill="freeze"/>
        <polygon points="-35,-20 0,0 0,-50 -35,-70" fill="url(#towerLeft)" stroke="#a78bfa" stroke-width="0.5"/>
        <polygon points="35,-20 0,0 0,-50 35,-70" fill="url(#towerRight)" stroke="#a78bfa" stroke-width="0.5"/>
        <polygon points="0,-50 35,-70 0,-90 -35,-70" fill="url(#towerTop)" stroke="#ffffff" stroke-width="0.6" filter="url(#glow)"/>
      </g>
      <text x="0" y="60" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#c9d1d9" letter-spacing="2">FRONTEND</text>
    </g>
  </g>

  <!-- ─── RIGHT: NEURAL CORE — ELO with rotating rings ─── -->
  <g transform="translate(960, 280)">
    <!-- title -->
    <text x="-110" y="-200" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#6a6a80" letter-spacing="3">NEURAL · CORE</text>
    <line x1="0" y1="-204" x2="160" y2="-204" stroke="#1a1530"/>

    <!-- soft outer glow -->
    <circle cx="0" cy="0" r="140" fill="url(#coreGlow)" filter="url(#softGlow)">
      <animate attributeName="r" values="135;150;135" dur="4s" repeatCount="indefinite"/>
    </circle>

    <!-- outer ring (rotating one direction) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="140" fill="none" stroke="url(#ring1)" stroke-width="1.5" stroke-dasharray="6 4"/>
      <circle cx="0" cy="-140" r="3.5" fill="#ec4899"/>
      <circle cx="140" cy="0" r="2" fill="#a78bfa"/>
    </g>

    <!-- middle ring (counter-rotating) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="9s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="118" fill="none" stroke="url(#ring2)" stroke-width="1" stroke-dasharray="2 6"/>
      <circle cx="0" cy="118" r="3" fill="#c084fc"/>
    </g>

    <!-- inner static ring with tick marks -->
    <g fill="none" stroke="#2a2050" stroke-width="1">
      <circle cx="0" cy="0" r="98"/>
    </g>
    <g stroke="#3a3050" stroke-width="0.8" opacity="0.7">
      <line x1="0" y1="-98" x2="0" y2="-94"/>
      <line x1="0" y1="98" x2="0" y2="94"/>
      <line x1="98" y1="0" x2="94" y2="0"/>
      <line x1="-98" y1="0" x2="-94" y2="0"/>
      <line x1="69" y1="-69" x2="66" y2="-66"/>
      <line x1="-69" y1="-69" x2="-66" y2="-66"/>
      <line x1="69" y1="69" x2="66" y2="66"/>
      <line x1="-69" y1="69" x2="-66" y2="66"/>
    </g>

    <!-- ELO mega number -->
    <g text-anchor="middle">
      <text y="-12" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#a78bfa" letter-spacing="6">ELO</text>
      <text y="36" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-2" filter="url(#glow)">
        1247
        <animate attributeName="opacity" values="0.4;1;0.95;1" dur="1.6s" fill="freeze"/>
      </text>
      <text y="60" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#ec4899" letter-spacing="3">ARCHITECT</text>
      <text y="76" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9" fill="#6a6a80" letter-spacing="2">TIER IV / VI</text>
    </g>
  </g>

  <!-- ─── PROGRESS PANEL (right bottom) ─── -->
  <g transform="translate(810, 470)">
    <rect width="320" height="78" rx="8" fill="#0a0420" stroke="#2a2050"/>
    <text x="20" y="24" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9" fill="#6a6a80" letter-spacing="3">NEXT TIER · TARGET 1500</text>

    <rect x="20" y="36" width="280" height="8" rx="4" fill="#1a1530"/>
    <rect x="20" y="36" width="0" height="8" rx="4" fill="url(#bar)">
      <animate attributeName="width" from="0" to="232" dur="1.8s" begin="0.6s" fill="freeze"/>
    </rect>
    <!-- shimmer -->
    <rect x="-60" y="36" width="60" height="8" rx="4" fill="url(#shimmer)" opacity="0.6">
      <animate attributeName="x" values="-60;320" dur="3s" begin="2.5s" repeatCount="indefinite"/>
    </rect>

    <text x="20" y="62" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9" fill="#a78bfa" letter-spacing="2">+253 XP</text>
    <text x="300" y="62" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9" fill="#ec4899" letter-spacing="2">83%</text>
  </g>

  <!-- ─── KPI STRIP ─── -->
  <g transform="translate(20, 590)" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" letter-spacing="2">
    <line x1="0" y1="-12" x2="1160" y2="-12" stroke="#1a1530"/>
    <text x="0" y="0" fill="#6a6a80">COMMITS</text>
    <text x="60" y="0" fill="#ffffff" font-weight="700">24</text>
    <text x="100" y="0" fill="#2a2050">│</text>
    <text x="120" y="0" fill="#6a6a80">LANGS</text>
    <text x="170" y="0" fill="#ffffff" font-weight="700">6</text>
    <text x="200" y="0" fill="#2a2050">│</text>
    <text x="220" y="0" fill="#6a6a80">FOCUS</text>
    <text x="270" y="0" fill="#ffffff" font-weight="700">AI · SEC · INFRA</text>
    <text x="430" y="0" fill="#2a2050">│</text>
    <text x="450" y="0" fill="#6a6a80">SINCE</text>
    <text x="500" y="0" fill="#ffffff" font-weight="700">2026.04</text>
    <text x="580" y="0" fill="#2a2050">│</text>
    <text x="600" y="0" fill="#6a6a80">CLASS</text>
    <text x="650" y="0" fill="#ffffff" font-weight="700">SELF-TAUGHT</text>
    <text x="780" y="0" fill="#2a2050">│</text>
    <text x="800" y="0" fill="#6a6a80">TREND</text>
    <text x="850" y="0" fill="#10b981" font-weight="700">↗ ASCENDING</text>
    <text x="980" y="0" fill="#2a2050">│</text>
    <text x="1000" y="0" fill="#6a6a80">RANK</text>
    <text x="1040" y="0" fill="#ec4899" font-weight="700">B+</text>
  </g>

  <!-- corner brackets -->
  <g stroke="#3a2470" stroke-width="1" fill="none" opacity="0.7">
    <path d="M14 14 L14 32 M14 14 L32 14"/>
    <path d="M1186 14 L1186 32 M1186 14 L1168 14"/>
    <path d="M14 606 L14 588 M14 606 L32 606"/>
    <path d="M1186 606 L1186 588 M1186 606 L1168 606"/>
  </g>
</svg>
